<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Xander-deane Practice</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./touch.css" />
  </head>
  <body class="touch-learning" data-device-profile="unknown" data-presentation-mode="full">
    <main class="learn-shell" aria-label="Tutoring session">
      <header class="lesson-header">
        <span class="lesson-label">Practice <small>Synthetic demo</small></span>
        <details class="activity-menu">
          <summary aria-label="Activity menu" title="Activity menu">&#8943;</summary>
          <nav aria-label="Activity options">
            <div class="subject-mini" role="group" aria-label="Choose an activity">
              <button type="button" data-subject="math" aria-pressed="true">Math</button>
              <button type="button" data-subject="language" aria-pressed="false">Language</button>
              <button type="button" data-subject="science" aria-pressed="false">Science</button>
            </div>
            <button id="speak-button" type="button">Read aloud</button>
            <a href="./toddler.html">Toddler play (2-3)</a>
            <a href="./parent.html">Family overview</a>
          </nav>
        </details>
      </header>
      <section class="problem-stage" aria-label="Problem area">
        <h1 id="problem-prompt" class="problem-prompt">Loading activity...</h1>
        <p id="tutor-message" class="ai-message" aria-live="polite"></p>
        <span id="ai-state" hidden></span>
        <div class="problem-workspace" id="workspace-root"></div>
      </section>
      <footer class="problem-actions" aria-label="Lesson actions">
        <button id="hint-button" type="button">Hint</button>
        <button class="primary" id="check-button" type="button" aria-label="Check answer">Check</button>
        <button id="reset-button" type="button">Reset</button>
      </footer>
    </main>
    <script type="module" src="./learn.js"></script>
  </body>
</html>
